name: evals

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Serialize eval runs to avoid exhausting the shared rate limit.
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: unit tests (no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q --deselect tests/test_llm_live.py

  gate:
    name: eval gate (real model calls)
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen

      - name: Run the eval gate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
        run: uv run python -m evals.gate --out gate-result.json

      - name: Upload the run's per-case records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-result
          path: gate-result.json
