name: nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  # Shares evals.yml's group so a full pass never overlaps a gate run.
  group: evals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nightly:
    name: nightly eval, regression check and alert
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen

      - name: Run the nightly
        id: nightly
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
        run: uv run tilsynsagent nightly

      - name: Commit the run record and any alert
        run: |
          git config user.name "tilsynsagent-nightly"
          git config user.email "noreply@github.com"
          git add var/evals/nightly var/evals/judge-agreement-*.md var/alerts evals/golden/cases.jsonl || true
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Nightly run $(date -u +%Y-%m-%d): eval record, alerts and promoted cases"
            git push
          fi

      - name: Upload the run's JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-run
          path: var/evals/nightly/*.json
