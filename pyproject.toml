[project]
name = "tilsynsagent"
version = "0.1.0"
description = "An agent that watches Danish regulatory publications, decides what matters, and escalates what it cannot."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.2",
    "groq>=0.11.0",
    "pydantic>=2.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "langfuse>=4.14,<5",
    "langchain>=1.0",
    "streamlit>=1.38",
]

[project.scripts]
tilsynsagent = "tilsynsagent.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilsynsagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
