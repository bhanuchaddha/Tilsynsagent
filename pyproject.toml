[project]
name = "tilsynsagent"
version = "0.1.0"
description = "An agent that watches Danish regulatory publications, decides what matters, and escalates what it cannot."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.2",
    "groq>=0.11.0",
    "pydantic>=2.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "langfuse>=4.14,<5",
    "langchain>=1.0",
    "streamlit>=1.38",
    # Document grounding (src/tilsynsagent/documents/). cryptography is not
    # optional: real plandata.dk PDFs are AES-encrypted with an empty password,
    # and pypdf raises DependencyError without it - verified live against a
    # 30 MB, 61-page document.
    "pypdf>=5.0",
    "cryptography>=3.1",
]

[project.scripts]
tilsynsagent = "tilsynsagent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    # Synthetic demo PDFs only (demo/documents.py) - never used at runtime.
    "reportlab>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilsynsagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
